<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTX Mecatrônica — automação industrial (aula de Tailwind)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mec: {
              bg: '#1B2024', // fundo — grafite escuro
              panel: '#242B30', // painel — um tom mais claro, pros cartões
              text: '#E7EAEC', // texto claro sobre o fundo escuro
              amber: '#E8B923', // amarelo de sinalização — cor de destaque
              blue: '#5B87A0', // azul-aço — cor secundária
              line: '#333B40', // bordas e divisores
            }
          },
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            body: ['IBM Plex Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body class="bg-mec-bg text-mec-text font-body antialiased">
  <header class="sticky top-0 z-50 bg-mec-bg/90 backdrop-blur border-b border-mec-line">
    <nav class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="#" class="font-display text-2xl font-bold">MTX <span class="text-mec-amber">Mecatrônica</span></a>
      <ul id="menu-desktop" class="hidden md:flex items-center gap-8 text-sm font-medium">
        <li><a href="#solutions" class="hover:text-mec-amber transition-colors">Soluções</a></li>
        <li><a href="#processo" class="hover:text-mec-amber transition-colors">Processo</a></li>
        <li><a href="#cliente" class="hover:text-mec-amber transition-colors">Clientes</a></li>
        <li><a href="#contato"
            class="bg-mec-amber text-mec-bg px-4 py-2 rounded-full font-semibold hover:bg-mec-text transition-colors">Pedir
            Orçamento</a></li>

      </ul>
      <button onclick="toggleMenu()" class="md:hidden p-2" aria-label="Abrir menu">

        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />

      </button>
    </nav>

  </header>


  <section class="bg-mec-panel py-20 grid grid-cols-1 md:grid-cols-2 gap-12   items-center justify-center">
    <div class="max-w-6xl mx-auto px-6 ">
      <h1 class="text-4xl md:text-5xl font-display font-bold mb-6">Mecânica,<br> eletrônica e <br><span
          class="text-mec-amber">software</span>, numa <br>peça só.</h1>
      <p class="text-lg md:text-xl mb-8 text-mec-text">Projetamos e integramos sistemas automatizados pra <br> linhas de
        produção, do sensor ao painel de controle.</p>
      <a href="#contato"
        class="bg-mec-amber text-mec-bg px-6 py-3 rounded-full font-semibold hover:bg-mec-text transition-colors">Pedir
        Orçamento</a>
      <a href="#solutions"
        class="border-2 border-mec-line text-mec-anel px-6 py-3 rounded-full font-semibold hover:bg-mec-text hover:text-mec-bg transition-colors">Ver
        Soluções</a>
    </div>


    <div
      class="flex h-64 w-96 items-center justify-center rounded-3xl border-8 border-mec-amber/40 bg-mec-panel shadow-lg font-display text-5xl ">
      ⚙️
    </div>

  </section>


</body>

</html>
